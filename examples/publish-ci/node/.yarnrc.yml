# This example is deliberately still on Yarn 4. The repo root migrated to pnpm,
# so it no longer supplies a Yarn version to walk up to. These are the settings
# that used to be inherited from the root `.yarnrc.yml`, pinned here instead.
#
# Reselect, React-Redux and Redux core clone this repo at pinned SHAs and run
# `yarn install` in this directory. Do not convert it to pnpm.
compressionLevel: mixed
enableGlobalCache: false
nodeLinker: node-modules
yarnPath: ../../../.yarn/releases/yarn-4.4.1.cjs
