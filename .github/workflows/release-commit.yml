name: Release Commit

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  pull-requests: write

jobs:
  release:
    name: Release Commit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - run: corepack enable

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          cache: 'yarn'
          check-latest: true
          node-version: '24.x'

      - name: Install dependencies
        run: yarn install

      - name: Build
        run: yarn run build:packages

      - name: Publish
        id: publish
        run: >
          yarn run --binaries-only --top-level pkg-pr-new publish
          ./packages/toolkit
          ./packages/rtk-query-graphql-request-base-query
          ./packages/rtk-query-codegen-openapi
          ./packages/rtk-codemods
          --yarn --packageManager="npm,yarn,pnpm,bun" --commentWithDev --commentWithSha
