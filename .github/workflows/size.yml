name: size
on:
  pull_request:
    branches:
      - master
      - 'feature/infinite-query-integration'
permissions:
  pull-requests: write
jobs:
  size:
    runs-on: ubuntu-latest
    env:
      CI_JOB_NUMBER: 1
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The size-limit action installs dependencies and runs the build itself,
      # so this job has no setup steps of its own. It only ever worked because
      # yarn is preinstalled on GitHub runners; pnpm is not, so it has to be
      # installed here. The version is pinned rather than read from
      # package.json, because the action checks out the PR base commit to
      # measure it and the base commit's package.json may still say yarn.
      # `install: false` matters more here than elsewhere: this job has no
      # install step because the action does its own, and an install at setup
      # time would run against the PR tree before the action resets to the base
      # commit.
      - uses: pnpm/setup@84cb39b217b10273981911c288cd62326dc7c6d2 # v2.0.2
        with:
          version: 11.23.0
          install: false
      - uses: EskiMojo14/size-limit-action@af0584be5b6cc2d056bd31a314fc2ce9c9c1a929 # v2
        with:
          directory: packages/toolkit
          github_token: ${{ secrets.GITHUB_TOKEN }}
          build_script: build-only
          package_manager: pnpm
          size_margin: non-zero
