name: CI
on:
  push:
    branches: [master]
  pull_request:
defaults:
  run:
    working-directory: ./packages/toolkit

jobs:
  changes:
    name: Check for changes
    runs-on: ubuntu-latest
    outputs:
      toolkit: ${{ steps.filter.outputs.toolkit }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: filter
        with:
          filters: |
            toolkit:
              - 'packages/toolkit/**'
              - 'examples/publish-ci/**'
              - 'examples/type-portability/**'
              - '.github/workflows/tests.yml'
              - '.oxlintrc.json'
              - '.oxfmtrc.json'
              - 'pnpm-lock.yaml'

  build:
    needs: changes
    if: ${{ needs.changes.outputs.toolkit == 'true' }}

    name: Lint, Test, Build & Pack on Node ${{ matrix.node }}

    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: ['24.x']

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before `setup-node`, or `cache: 'pnpm'` cannot locate the store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Lint
        working-directory: .
        run: pnpm lint

      - name: Format check
        working-directory: .
        run: pnpm format:check

      # Read existing version, reuse that, add a Git short hash
      - name: Set build version to Git commit
        run: pnpm exec tsx scripts/writeGitVersion.mts $(git rev-parse --short HEAD)

      - name: Check updated version
        run: jq .version package.json

      # pnpm names the tarball `<name>-<version>.tgz`; every consumer below
      # expects `package.tgz`, so name it explicitly.
      - name: Pack
        run: pnpm pack --out package.tgz

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: package
          path: packages/toolkit/package.tgz

  test-dist:
    name: Run local tests against build artifact (React ${{ matrix.react.version }})
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x']
        react:
          - version: '^18'
            types: '^18'
            react-dom: { version: '^18', types: '^18' }
          - version: '^19'
            types: '^19'
            react-dom: { version: '^19', types: '^19' }

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before `setup-node`, or `cache: 'pnpm'` cannot locate the store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Download build artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: packages/toolkit

      - name: Check folder contents
        run: ls -lah

      # `pnpm update -r <pkg>@<range>` is the counterpart to `yarn up`: it
      # rewrites the declared range in every workspace that already depends on
      # the package. It will not add the dependency anywhere new.
      - name: Install React ${{ matrix.react.version }} and React-DOM ${{ matrix.react.react-dom.version }}
        run: pnpm update -r react@${{ matrix.react.version }} react-dom@${{ matrix.react.react-dom.version }} @types/react@${{ matrix.react.types }} @types/react-dom@${{ matrix.react.react-dom.types }}

      - name: Install build artifact
        run: pnpm --filter @reduxjs/toolkit add $(pwd)/package.tgz

      - name: Erase path aliases
        run: sed -i -e /@remap-prod-remove-line/d ./tsconfig.base.json

      - name: Run type tests with `moduleResolution Bundler`
        run: rm -rf dist && pnpm exec tsc -p . --moduleResolution Bundler --module ESNext --noEmit false --declaration --emitDeclarationOnly --outDir dist --target ESNext && rm -rf dist

      - name: Ensure there's no dist folder
        run: rm -rf dist

      - name: Change RTK package name to ensure node_modules is used
        run: sed -i -e 's|@reduxjs/toolkit|@reduxjs/toolkit-test|' ./package.json

      - name: Run tests, against installed artifact
        env:
          TEST_DIST: true
        working-directory: ./packages/toolkit
        run: ../../node_modules/.bin/vitest --run --typecheck

  test-types:
    name: 'Test Types: TS ${{ matrix.ts }} and React ${{ matrix.react.version }}'

    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sparse matrix: All TS versions with React 19, boundary TS versions with React 18
        include:
          # React 19 × all TS versions
          - node: '24.x'
            ts: '5.6'
            react:
              {
                version: '^19',
                types: '^19',
                react-dom: { version: '^19', types: '^19' },
              }
          - node: '24.x'
            ts: '5.7'
            react:
              {
                version: '^19',
                types: '^19',
                react-dom: { version: '^19', types: '^19' },
              }
          - node: '24.x'
            ts: '5.8'
            react:
              {
                version: '^19',
                types: '^19',
                react-dom: { version: '^19', types: '^19' },
              }
          - node: '24.x'
            ts: '5.9'
            react:
              {
                version: '^19',
                types: '^19',
                react-dom: { version: '^19', types: '^19' },
              }
          - node: '24.x'
            ts: '6.0'
            react:
              {
                version: '^19',
                types: '^19',
                react-dom: { version: '^19', types: '^19' },
              }
          - node: '24.x'
            ts: 'next'
            react:
              {
                version: '^19',
                types: '^19',
                react-dom: { version: '^19', types: '^19' },
              }
          # React 18 × boundary TS versions only (5.6, 6.0, next)
          - node: '24.x'
            ts: '5.6'
            react:
              {
                version: '^18',
                types: '^18',
                react-dom: { version: '^18', types: '^18' },
              }
          - node: '24.x'
            ts: '6.0'
            react:
              {
                version: '^18',
                types: '^18',
                react-dom: { version: '^18', types: '^18' },
              }
          - node: '24.x'
            ts: 'next'
            react:
              {
                version: '^18',
                types: '^18',
                react-dom: { version: '^18', types: '^18' },
              }

    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before `setup-node`, or `cache: 'pnpm'` cannot locate the store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - name: Install React ${{ matrix.react.version }} and React-DOM ${{ matrix.react.react-dom.version }}
        run: pnpm update -r react@${{ matrix.react.version }} react-dom@${{ matrix.react.react-dom.version }} @types/react@${{ matrix.react.types }} @types/react-dom@${{ matrix.react.react-dom.types }}

      - name: Install TypeScript ${{ matrix.ts }}
        run: pnpm add typescript@${{ matrix.ts }}

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: packages/toolkit

      - name: Install build artifact
        run: pnpm add ./package.tgz

      # `pnpm info` is an alias for `pnpm view` and queries the registry;
      # `pnpm list` is what reports the *installed* version, as `yarn info` did.
      - name: Show installed RTK versions
        run: pnpm list @reduxjs/toolkit

      - name: Erase path aliases
        run: sed -i -e /@remap-prod-remove-line/d ./tsconfig.base.json

      - name: Test types (TS 5.x)
        if: matrix.ts != 'next' && !startsWith(matrix.ts, '6.')
        env:
          TEST_DIST: true
        run: |
          pnpm exec tsc --version
          pnpm type-tests

      - name: Test types (TS 6.x/next)
        if: matrix.ts == 'next' || startsWith(matrix.ts, '6.')
        env:
          TEST_DIST: true
        run: |
          pnpm exec tsc --version
          pnpm exec tsc -p tsconfig.test.json --noEmit --ignoreDeprecations 6.0

  test-published-artifact:
    name: Test Published Artifact ${{ matrix.example }}

    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x']
        example: ['next', 'vite', 'node', 'react-native', 'expo']
    defaults:
      run:
        working-directory: ./examples/publish-ci/${{ matrix.example }}
    env:
      YARN_ENABLE_IMMUTABLE_INSTALLS: false
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # No `cache:` here. `setup-node`'s cache input runs the package manager at
      # the *repository root* regardless of `defaults.run.working-directory`, and
      # `cache-dependency-path` only picks which lockfile is hashed. The root is
      # pnpm now, so `cache: 'yarn'` would run Yarn against a pnpm project and
      # fail. These examples install with the repo-local Yarn 4 release named by
      # their own `.yarnrc.yml`.
      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}

      - name: Install deps
        run: yarn install

      - name: Remove existing RTK
        run: yarn remove @reduxjs/toolkit

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: ./examples/publish-ci/${{ matrix.example }}

      - name: Check folder contents
        run: ls -l .

      - name: Install RTK build artifact
        run: yarn add ./package.tgz

      - name: Show installed RTK versions
        run: yarn info @reduxjs/toolkit && yarn why @reduxjs/toolkit

      - name: Set up JDK 21 for React Native build
        if: matrix.example == 'react-native' || matrix.example == 'expo'
        uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          java-version: '21.x'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Build example
        run: yarn build

      - name: playwright install
        if: matrix.example == 'next' || matrix.example == 'vite'
        run: yarn exec playwright install --with-deps chromium

      - name: Run test step
        run: yarn test

  are-the-types-wrong:
    name: Check package config with are-the-types-wrong

    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x']
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before `setup-node`, or `cache: 'pnpm'` cannot locate the store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: packages/toolkit

      - name: show folder
        run: ls -l .

      # `pnpm <binary>` has no `node_modules/.bin` fallback the way `yarn <binary>`
      # does, so local binaries need `pnpm exec`.
      - name: Run are-the-types-wrong
        run: pnpm exec attw ./package.tgz --format table

  test-type-portability:
    name: 'Test Type Portability: TS ${{ matrix.ts }} + Node ${{ matrix.node }}'
    needs: [build]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Sparse matrix: All TS versions with bundler, boundary TS versions with nodenext
        include:
          # bundler × all TS versions
          - node: '24.x'
            ts: '5.6'
            example: { name: 'bundler', moduleResolution: 'Bundler' }
          - node: '24.x'
            ts: '5.7'
            example: { name: 'bundler', moduleResolution: 'Bundler' }
          - node: '24.x'
            ts: '5.8'
            example: { name: 'bundler', moduleResolution: 'Bundler' }
          - node: '24.x'
            ts: '5.9'
            example: { name: 'bundler', moduleResolution: 'Bundler' }
          - node: '24.x'
            ts: '6.0'
            example: { name: 'bundler', moduleResolution: 'Bundler' }
          - node: '24.x'
            ts: 'next'
            example: { name: 'bundler', moduleResolution: 'Bundler' }
          # nodenext-cjs × boundary TS versions only (5.6, 6.0, next)
          - node: '24.x'
            ts: '5.6'
            example: { name: 'nodenext-cjs', moduleResolution: 'NodeNext' }
          - node: '24.x'
            ts: '6.0'
            example: { name: 'nodenext-cjs', moduleResolution: 'NodeNext' }
          - node: '24.x'
            ts: 'next'
            example: { name: 'nodenext-cjs', moduleResolution: 'NodeNext' }
          # nodenext-esm × boundary TS versions only (5.6, 6.0, next)
          - node: '24.x'
            ts: '5.6'
            example: { name: 'nodenext-esm', moduleResolution: 'NodeNext' }
          - node: '24.x'
            ts: '6.0'
            example: { name: 'nodenext-esm', moduleResolution: 'NodeNext' }
          - node: '24.x'
            ts: 'next'
            example: { name: 'nodenext-esm', moduleResolution: 'NodeNext' }
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before `setup-node`, or `cache: 'pnpm'` cannot locate the store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: packages/toolkit

      # Three flags here, none of them cosmetic.
      #
      # `--ignore-workspace`: pnpm resolves a dependency to a same-named
      # workspace project whenever one exists, and that wins over a `file:`
      # tarball specifier, over `linkWorkspacePackages: false`, and over a
      # `pnpm-workspace.yaml` override. All three were tried and all three still
      # produced `version: link:../../../packages/toolkit` in the lockfile - the
      # job would have typechecked the unbuilt workspace sources instead of the
      # published artifact. Detaching the example is the only thing that works.
      #
      # `--node-linker=hoisted`: a detached install does not inherit the root
      # `pnpm-workspace.yaml`, so it falls back to pnpm's isolated layout, where
      # immer lands at `node_modules/.pnpm/immer@11.1.17/node_modules/immer`.
      # That path is not nameable, so every RTK Query util fails TS2883 ("cannot
      # be named without a reference to 'Patch'"). Verified: hoisted passes,
      # isolated produces 7 TS2883 errors.
      #
      # `--ignore-scripts`: a detached install does not inherit the root
      # `allowBuilds` allowlist either and would fail on esbuild. This job only
      # runs `tsc`, so no native binary is needed.
      - name: Install build artifact
        working-directory: ./examples/type-portability/${{ matrix.example.name }}
        run: |
          npm pkg delete dependencies.@reduxjs/toolkit
          pnpm add --ignore-workspace --ignore-scripts --node-linker=hoisted "$GITHUB_WORKSPACE/packages/toolkit/package.tgz"

      - name: Install TypeScript ${{ matrix.ts }}
        working-directory: ./examples/type-portability/${{ matrix.example.name }}
        run: pnpm add --ignore-workspace --ignore-scripts --node-linker=hoisted -D typescript@${{ matrix.ts }}

      # `tsc` is invoked directly rather than through the package's own `test`
      # script. `pnpm run` performs an implicit workspace install when the
      # manifest and lockfile disagree, which re-links `@reduxjs/toolkit` back to
      # the workspace sources and undoes the step above. `--ignore-workspace` on
      # `pnpm run` does not prevent it.
      - name: Test type portability with `moduleResolution ${{ matrix.example.moduleResolution }}`
        working-directory: ./examples/type-portability/${{ matrix.example.name }}
        run: rm -rf dist && node_modules/.bin/tsc -p tsconfig.json

      - name: Test type portability with `moduleResolution Node10`
        if: matrix.ts != 'next' && !startsWith(matrix.ts, '6.')
        working-directory: ./examples/type-portability/${{ matrix.example.name }}
        run: rm -rf dist && node_modules/.bin/tsc -p tsconfig.json --module CommonJS --moduleResolution Node10 --preserveSymLinks --verbatimModuleSyntax false

      # `npm --workspace=<name> pkg set` needed the root `workspaces` field to
      # resolve the name, and that field went away with Yarn. Run inside the
      # package directory, `npm pkg set` needs no workspace resolution at all.
      - name: Test type portability with `moduleResolution Node10` and `type module` in `package.json`
        if: (matrix.example.name == 'nodenext-esm' || matrix.example.name == 'bundler') && matrix.ts != 'next' && !startsWith(matrix.ts, '6.')
        working-directory: ./examples/type-portability/${{ matrix.example.name }}
        run: |
          npm pkg set type=module
          rm -rf dist && node_modules/.bin/tsc -p tsconfig.json --module ESNext --moduleResolution Node10 --preserveSymLinks --verbatimModuleSyntax false

  # Advisory only. Reports how RTK's types behave under the next major TypeScript
  # release without blocking any PR. `@typescript/native-preview` was the
  # pre-release channel for the Go port and is deprecated now that TypeScript 7
  # ships from the `typescript` package itself, so this job installs real
  # `typescript@7` under an npm alias instead.
  test-types-typescript-7:
    name: 'Test Types: TypeScript 7 (advisory)'
    needs: [build]
    runs-on: ubuntu-latest
    continue-on-error: true
    strategy:
      fail-fast: false
      matrix:
        node: ['24.x']
    steps:
      - name: Checkout repo
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Must run before `setup-node`, or `cache: 'pnpm'` cannot locate the store.
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - name: Use node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: 'pnpm'

      - name: Install deps
        run: pnpm install

      # npm alias, so the repo's own `typescript` devDependency stays on 6.x and
      # every other job keeps testing what it tested before.
      - name: Install TypeScript 7
        run: pnpm add -D typescript-7@npm:typescript@7

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: package
          path: packages/toolkit

      - name: Install build artifact
        run: pnpm add ./package.tgz

      - name: Show installed RTK versions
        run: pnpm list @reduxjs/toolkit

      - name: Erase path aliases
        run: sed -i -e /@remap-prod-remove-line/d ./tsconfig.base.json

      # Invoked by path rather than through `pnpm exec tsc`. The alias also claims
      # the `tsc` bin, so `pnpm exec tsc` happens to resolve to 7 today, but
      # depending on that would let this job silently test the wrong compiler.
      # `--version` must print 7.x for the run below to mean anything.
      - name: Test types with TypeScript 7
        env:
          TEST_DIST: true
        run: |
          TSC7="$(ls -d ../../node_modules/typescript-7 node_modules/typescript-7 2>/dev/null | head -1)/bin/tsc"
          node "$TSC7" --version
          node "$TSC7" -p tsconfig.test.json --noEmit --moduleResolution Bundler

      # See the note in `test-type-portability`: without `--ignore-workspace`
      # pnpm links `@reduxjs/toolkit` to the workspace sources instead of
      # installing the tarball.
      - name: Install build artifact for type-portability example
        working-directory: ./examples/type-portability/bundler
        run: |
          npm pkg delete dependencies.@reduxjs/toolkit
          pnpm add --ignore-workspace --ignore-scripts --node-linker=hoisted "$GITHUB_WORKSPACE/packages/toolkit/package.tgz"

      - name: Install TypeScript 7 for type-portability example
        working-directory: ./examples/type-portability/bundler
        run: pnpm add --ignore-workspace --ignore-scripts --node-linker=hoisted -D typescript-7@npm:typescript@7

      - name: Test type portability with TypeScript 7 (bundler example)
        working-directory: ./examples/type-portability/bundler
        run: |
          node node_modules/typescript-7/bin/tsc --version
          node node_modules/typescript-7/bin/tsc --noEmit
