# DiffLoupe review for pull requests, running alongside CodeRabbit for comparison.
#
# DiffLoupe reviews same-repo pull requests only. Fork pull requests get no
# secrets, and an agent holding the key should not read untrusted fork text.
# CodeRabbit is a GitHub App and reviews fork pull requests.
#
# The review job runs the model with read-only GitHub permissions. The post job
# runs no model and is the only job that writes to the PR. There is no merge
# gate while the two reviewers are being compared.
#
# Needs the DIFFLOUPE_ANTHROPIC_API_KEY secret: a dedicated key with a low spend
# limit, because the model reads text the PR author wrote.

name: AI code review

on:
  pull_request:
    types: [opened, synchronize, ready_for_review]
    paths-ignore:
      - 'docs/**'
      - 'website/**'
      - '**/*.md'
      - '**/*.mdx'
  workflow_dispatch:
    inputs:
      pr:
        description: Pull request number
        required: true
        type: number

concurrency:
  group: ai-review-${{ github.event.pull_request.number || inputs.pr }}
  cancel-in-progress: true

permissions: {}

env:
  DIFFLOUPE_VERSION: '0.5.0'
  # The v0.5.0 tag commit. The post job runs the posting script from it.
  DIFFLOUPE_COMMIT: c9fbc6763e620f7a52a3cd42ad81a3860df2dc6c
  MAX_DIFF_LINES: '30000'
  MAX_DIFF_FILES: '200'

jobs:
  review:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.pull_request.draft == false &&
      github.event.pull_request.user.type != 'Bot' &&
      github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: read
    outputs:
      pr: ${{ steps.pr.outputs.number }}
      head: ${{ steps.pr.outputs.head }}
      reviewed: ${{ steps.result.outputs.reviewed }}
      skip-reason: ${{ steps.result.outputs.skip-reason }}
      artifact: ${{ steps.result.outputs.artifact }}
      artifact_url: ${{ steps.upload.outputs.artifact-url }}
    steps:
      - name: Resolve PR
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          INPUT_PR: ${{ inputs.pr }}
        run: |
          set -euo pipefail
          pr="${EVENT_PR:-$INPUT_PR}"
          info=$(gh api "repos/$GITHUB_REPOSITORY/pulls/$pr")
          if [ "$(jq -r '.head.repo.full_name' <<<"$info")" != "$GITHUB_REPOSITORY" ]; then
            echo "::error::PR #$pr is from a fork; not reviewing it."
            exit 1
          fi
          {
            echo "number=$pr"
            echo "base=$(jq -r '.base.sha' <<<"$info")"
            echo "head=$(jq -r '.head.sha' <<<"$info")"
          } >> "$GITHUB_OUTPUT"
          echo "OUT=$RUNNER_TEMP/diffloupe-out" >> "$GITHUB_ENV"
          echo "CONFIG=$RUNNER_TEMP/diffloupe.json" >> "$GITHUB_ENV"

      # The head commit, not the merge commit, so line numbers match Files Changed.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ steps.pr.outputs.head }}
          fetch-depth: 0
          persist-credentials: false

      - name: Measure the diff
        id: size
        env:
          BASE: ${{ steps.pr.outputs.base }}
          HEAD: ${{ steps.pr.outputs.head }}
        run: |
          set -euo pipefail
          base=$(git merge-base "$BASE" "$HEAD")
          stats=$(git diff --numstat "$base" "$HEAD" -- . \
            ':(exclude,glob)**/pnpm-lock.yaml' ':(exclude,glob)**/__snapshots__/**' ':(exclude,glob)**/dist/**')
          files=$(grep -c . <<<"$stats" || true)
          lines=$(awk '$1 != "-" { n += $1 + $2 } END { print n + 0 }' <<<"$stats")
          echo "Diff: $files files, $lines lines" >> "$GITHUB_STEP_SUMMARY"
          if [ "$lines" -gt "$MAX_DIFF_LINES" ] || [ "$files" -gt "$MAX_DIFF_FILES" ]; then
            echo "Too large for automatic review; skipped." >> "$GITHUB_STEP_SUMMARY"
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi

      # Read the config from the base commit, so a PR cannot rewrite the
      # reviewer's instructions.
      - name: Load config from base
        if: steps.size.outputs.skip != 'true'
        env:
          BASE: ${{ steps.pr.outputs.base }}
        run: |
          if ! git show "$BASE:.github/diffloupe.json" > "$CONFIG" 2>/dev/null; then
            echo "::warning::No .github/diffloupe.json on the base commit; using the PR's copy."
            cp .github/diffloupe.json "$CONFIG"
          fi

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        if: steps.size.outputs.skip != 'true'

      # DiffLoupe needs OpenCode 2.x from @opencode/cli; `opencode-ai` is 1.x.
      - name: Install DiffLoupe
        if: steps.size.outputs.skip != 'true'
        run: npm install -g @opencode/cli@2.0.32 tilth@0.9.0 "@acemarke/diffloupe@$DIFFLOUPE_VERSION"

      - name: Doctor
        if: steps.size.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DIFFLOUPE_ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
        run: diffloupe doctor --strict --config "$CONFIG"

      # Exit codes: 0 reviewed or skipped, 1 run failed, 2 could not start,
      # 4 skipped by --max-rounds. The post job still posts the notice for 4.
      - name: Review
        if: steps.size.outputs.skip != 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.DIFFLOUPE_ANTHROPIC_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ steps.pr.outputs.number }}
          HEAD_SHA: ${{ steps.pr.outputs.head }}
        run: |
          code=0
          diffloupe review "#$PR" --headless --github --head "$HEAD_SHA" \
            --config "$CONFIG" --out "$OUT" --max-cost 5 --max-rounds 3 || code=$?
          [ "$code" -eq 4 ] && exit 0
          exit "$code"

      # Artifacts on a public repo can be downloaded by anyone, and the post job
      # publishes the payloads. A prompt-injected agent could copy the key into
      # its output, so refuse to pass on anything that contains it.
      - name: Check output for the API key
        id: leak
        if: always() && steps.size.outputs.skip != 'true'
        env:
          KEY: ${{ secrets.DIFFLOUPE_ANTHROPIC_API_KEY }}
        run: |
          [ -d "$OUT" ] || exit 0
          if [ -n "$KEY" ] && grep -rqF -- "$KEY" "$OUT"; then
            echo "::error::Review output contains the API key. Not uploading or posting. Rotate the key."
            rm -rf "$OUT"
            exit 1
          fi

      - name: Read result
        id: result
        if: always() && steps.leak.outcome == 'success'
        run: |
          set -euo pipefail
          [ -f "$OUT/result.json" ] || exit 0
          echo "reviewed=$(jq -r '.reviewed' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
          echo "skip-reason=$(jq -r '.skipReason // empty' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
          echo "artifact=$(jq -r '.artifactName // empty' "$OUT/result.json")" >> "$GITHUB_OUTPUT"
          jq -r '"**\(.status)** — \(.findings.posted) finding(s), $\(.costUsd * 100 | round / 100), round \(.round)"' \
            "$OUT/result.json" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$OUT/findings.md" ]; then
            { echo; cat "$OUT/findings.md"; } >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload review
        id: upload
        if: always() && steps.result.outputs.artifact != ''
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ${{ steps.result.outputs.artifact }}
          path: ${{ runner.temp }}/diffloupe-out/
          retention-days: 90

  post:
    needs: review
    if: >-
      needs.review.outputs.reviewed == 'true' ||
      needs.review.outputs.skip-reason == 'round-limit'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # The only job that writes to the PR, and it runs no model.
    permissions:
      contents: read
      pull-requests: write
    steps:
      # The posting script imports only node builtins and its own modules.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: markerikson/diffloupe
          ref: ${{ env.DIFFLOUPE_COMMIT }}
          path: diffloupe
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.review.outputs.artifact }}
          path: review

      - name: Post review
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.review.outputs.pr }}
          HEAD: ${{ needs.review.outputs.head }}
          ARTIFACT_URL: ${{ needs.review.outputs.artifact_url }}
          DRY_RUN: '0'
        run: bun diffloupe/src/review/post.ts review/payloads.json
